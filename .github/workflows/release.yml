name: release
# Al empujar un tag vX.Y.Z: compila y publica klipper-boostkit.zip (formato
# "web" de Moonraker: el contenido de dist/ + release_info.json en la raíz).
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: zip
        run: |
          VER="${GITHUB_REF_NAME}"
          printf '{"project_name":"klipper-boostkit","project_owner":"aorizondo","version":"%s"}\n' "$VER" > dist/release_info.json
          (cd dist && zip -qr ../klipper-boostkit.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: klipper-boostkit
          path: klipper-boostkit.zip
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" klipper-boostkit.zip --title "$GITHUB_REF_NAME" --generate-notes
