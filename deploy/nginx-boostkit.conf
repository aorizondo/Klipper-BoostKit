# BoostKit en http://<host>:82 — misma Moonraker que Mainsail/Fluidd (127.0.0.1:7125).
# install.sh lo copia a /etc/nginx/sites-available/boostkit (sustituye __ROOT__).
server {
    listen 82 default_server;
    access_log /var/log/nginx/boostkit-access.log;
    error_log /var/log/nginx/boostkit-error.log;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 0;

    root __ROOT__;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location /websocket {
        proxy_pass http://127.0.0.1:7125/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
    location ~ ^/(printer|api|access|machine|server)/ {
        proxy_pass http://127.0.0.1:7125$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
    }
}
